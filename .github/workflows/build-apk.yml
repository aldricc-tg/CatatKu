name: Build CatatKu APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android Flutter project
        run: |
          flutter create --platforms=android --org com.catatku --project-name catatku build_app
          rm -rf build_app/lib
          cp -r lib build_app/lib
          cp pubspec.yaml build_app/pubspec.yaml
          cd build_app
          flutter pub get

      - name: Build release APK
        run: |
          cd build_app
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CatatKu-APK
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
